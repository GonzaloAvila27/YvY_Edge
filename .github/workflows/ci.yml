name: CI

# Gates de calidad de YVY Edge, todos BLOQUEANTES. Antes de esto el linter no
# protegía nada (audit/peer-review §3.4: "quality gates invertidos"). El proyecto
# vive en el subdirectorio `yvy/`.
#
#   lint       ruff (lint + formato)
#   arch       reglas arquitectónicas del proyecto, que ningún linter conoce
#              (ver scripts/check_arch_rules.py)
#   types      mypy sobre los contratos de tipos (ver docs/PLAN_ADOPCION_MYPY.md)
#
# Follow-up (no incluido acá): job de pytest. Requiere validar el entorno
# headless (MPLBACKEND=Agg, tkinter skip, refresh de poetry.lock).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yvy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinneado a la misma versión que el entorno local y `ruff = "^0.7.0"`
      # en pyproject. La config de reglas vive en yvy/pyproject.toml.
      - name: Install ruff
        run: pip install ruff==0.7.4

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  arch:
    name: Reglas arquitectónicas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yvy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sólo usa la stdlib (ast): no hace falta instalar el proyecto ni sus deps.
      # Cada regla existe porque su violación ya causó un incidente, o porque
      # cerrarla costó una iniciativa entera del plan de estabilización.
      - name: Check arch rules
        run: python scripts/check_arch_rules.py

  types:
    name: mypy (contratos y tipos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yvy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinneado como ruff. Un bump de mypy es un PR deliberado, nunca implícito:
      # cambiar de versión cambia la inferencia (INI-6 · §9).
      - name: Install mypy
        run: pip install mypy==1.20.2

      # RATCHET DE ALCANCE (INI-6 · §4): esta lista de paquetes es el gate. Sólo
      # crece, y cada paquete entra a 0 en su nivel de strictness (pyproject) y
      # se queda en 0. Los niveles de las capas que todavía NO están acá ya están
      # declarados en pyproject para poder medir la distancia con `mypy src`.
      # NO se corre `mypy src`: eso incluiría la deuda todavía no saldada.
      # domain/ resuelve con mypy_path=src (stdlib puro), sin instalar el proyecto.
      #
      # Próximas etapas — agregar a esta línea cuando el paquete llegue a 0:
      #   etapa 4: scripts                etapa 5: src/yvy/presentation
      - name: Check types (paquetes en el gate)
        run: mypy src/yvy/domain src/yvy/application src/yvy/infrastructure src/yvy/cli
