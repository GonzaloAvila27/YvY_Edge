[tool.poetry]
name = "yvy"
version = "0.1.0"
description = "Sistema meteorológico escolar offline-first para Instituciones de Educación Agropecuaria de Misiones"
authors = ["Gonzalo Avila <gonzalo.avila@example.ar>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "yvy", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pywws = ">=24.5.0"
requests = "^2.32.0"
cryptography = "^43.0.0"
bcrypt = "^4.2.0"
pillow = "^11.0.0"
matplotlib = "^3.9.0"
schedule = "^1.2.0"
pydantic-settings = "^2.5.0"
pydantic = "^2.9.0"
tzdata = "^2026.2"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
hypothesis = "^6.115.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
freezegun = "^1.5.0"
respx = "^0.21.0"

[tool.poetry.scripts]
yvy = "yvy.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ──────────────────────────────────────────────────────────────────────────────
# Ruff (linter + formatter unificado)
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "migrations/*.sql",
    "data/",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function-call-in-default-argument (común en FastAPI/typer)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # asserts permitidos en tests
    "N802",   # nombres de tests pueden romper convención
]
"src/yvy/presentation/**/*.py" = [
    "N802",   # tkinter usa nombres camelCase
    "N803",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ──────────────────────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: tests unitarios rápidos (sin DB, sin red)",
    "integration: tests con DB real o servicios externos mockeados",
    "e2e: tests end-to-end del flujo completo",
    "property: tests de propiedad con hypothesis",
    "slow: tests que tardan >1s",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]

[tool.coverage.run]
source = ["src/yvy"]
branch = true
omit = [
    "*/presentation/*",
    "*/main.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

# ──────────────────────────────────────────────────────────────────────────────
# Mypy (type checking diferenciado por módulo)
# ──────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
files = ["src/yvy"]
exclude = [
    "tests/",
    "migrations/",
    "data/",
]

# Configuración base permisiva
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

# ESTRICTO en domain/ y application/
[[tool.mypy.overrides]]
module = [
    "yvy.domain.*",
    "yvy.application.*",
]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
disallow_any_explicit = false
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

# CASUAL en presentation/ (Tkinter no juega bien con strict)
[[tool.mypy.overrides]]
module = "yvy.presentation.*"
ignore_errors = false
disallow_untyped_defs = false
check_untyped_defs = false

# Infrastructure: intermedio
[[tool.mypy.overrides]]
module = "yvy.infrastructure.*"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
