[tool.poetry]
name = "yvy"
version = "1.5.1"
description = "Sistema meteorológico escolar offline-first para Instituciones de Educación Agropecuaria de Misiones"
authors = ["Gonzalo Avila <gonzalo.avila@example.ar>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "yvy", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pywws = ">=24.5.0"
requests = "^2.32.0"
cryptography = "^43.0.0"
bcrypt = "^4.2.0"
pillow = "^11.0.0"
matplotlib = "^3.9.0"
schedule = "^1.2.0"
pydantic-settings = "^2.5.0"
pydantic = "^2.9.0"
tzdata = "^2026.2"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
hypothesis = "^6.115.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
freezegun = "^1.5.0"
respx = "^0.21.0"

[tool.poetry.scripts]
yvy = "yvy.cli.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ──────────────────────────────────────────────────────────────────────────────
# Ruff (linter + formatter unificado)
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "migrations/*.sql",
    "data/",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function-call-in-default-argument (común en FastAPI/typer)
    # Texto en español (á é í ó ú ñ ¿ ¡) es "unicode ambiguo" para ruff
    # (lookalikes cirílicos/griegos). Falso positivo en toda la base → se ignora.
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    # Preferencias de estilo: la forma actual suele ser más clara.
    "SIM102", # collapsible-if (ifs anidados a veces más legibles que un `and` largo)
    "SIM105", # suppressible-exception (try/except/pass explícito es aceptable;
              # theme_manager lo usa a propósito en su walk por-widget, ver docstring)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # asserts permitidos en tests
    "N802",   # nombres de tests pueden romper convención
    "E402",   # imports tras setup de fixtures/paths
    "F841",   # vars de setup asignadas por su efecto (creación en DB) sin usar el nombre
    "E741",   # nombres cortos en escenarios de test
    "B007",   # loop vars sin usar en tests
]
"src/yvy/presentation/**/*.py" = [
    "N802",   # tkinter usa nombres camelCase
    "N803",
    "N806",   # matplotlib/tkinter: vars locales no-lowercase (X, Y, ...)
]
"src/yvy/application/use_cases/compute_derived.py" = [
    "N806",   # variables de fórmulas meteorológicas (T, RH, es, ea) por convención
]
"scripts/**/*.py" = [
    "E402",   # scripts utilitarios: setup de sys.path/entorno antes de imports
    "B007",   # loop vars sin usar en scripts one-off
    "N801",   # convención laxa de nombres en scripts
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ──────────────────────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: tests unitarios rápidos (sin DB, sin red)",
    "integration: tests con DB real o servicios externos mockeados",
    "e2e: tests end-to-end del flujo completo",
    "property: tests de propiedad con hypothesis",
    "slow: tests que tardan >1s",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]

[tool.coverage.run]
source = ["src/yvy"]
branch = true
omit = [
    "*/presentation/*",
    "*/main.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

# ──────────────────────────────────────────────────────────────────────────────
# Mypy (type checking diferenciado por módulo)
# ──────────────────────────────────────────────────────────────────────────────
# Niveles de strictness por capa — INI-6 · §5. Se declaran acá TODOS desde la
# etapa 0, aunque el gate de CI (job `types`) empiece corriendo sólo los
# paquetes ya en 0. Así `mypy src` es la vara de medición real: la distancia de
# cada capa a su objetivo es inequívoca. El conteo global NO gatea nada — el
# ratchet es la lista de paquetes del job de CI (ver docs/PLAN_ADOPCION_MYPY.md).
[tool.mypy]
python_version = "3.12"
# src layout: resuelve el paquete `yvy` sin necesitar el install editable, para
# que el job de CI corra con sólo `pip install mypy` (como lint y arch).
mypy_path = ["src"]
files = ["src/yvy"]
exclude = [
    "tests/",
    "migrations/",
    "data/",
]

# Configuración base permisiva
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# Flag global (no válido en overrides por módulo). Barato y sin falsos positivos
# medidos: 0 errores nuevos en todo src.
warn_redundant_casts = true

# domain/ + application/ — strict. Son el contrato del sistema; ya se pagó una
# vez (Fase 9.2). application regresionó en silencio por no tener gate: INI-6 · §2.1.
[[tool.mypy.overrides]]
module = [
    "yvy.domain.*",
    "yvy.application.*",
]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
disallow_any_explicit = false
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

# infrastructure/ + cli/ — strict-lite. Los puertos quedan tipados; las llamadas
# a libs externas (pywws, hid, httpx) no fuerzan genéricos exhaustivos, así que
# NO se activa disallow_any_generics.
[[tool.mypy.overrides]]
module = [
    "yvy.infrastructure.*",
    "yvy.cli.*",
]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

# presentation/ — base + check_untyped_defs + warn_unused_ignores. El pegamento
# Tk tiene stubs mediocres; el valor está en las fronteras con application, que
# el lado application ya verifica strict. No se exige disallow_untyped_defs.
[[tool.mypy.overrides]]
module = "yvy.presentation.*"
ignore_errors = false
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
