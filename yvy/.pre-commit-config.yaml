# Pre-commit hooks de YVY
# Instalar: poetry run pre-commit install
# Ejecutar manual: poetry run pre-commit run --all-files

repos:
  # ───────────────────────────────────────────────────────────────────────────
  # Hooks básicos del proyecto
  # ───────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ───────────────────────────────────────────────────────────────────────────
  # Ruff: linter + formatter
  # ───────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ───────────────────────────────────────────────────────────────────────────
  # Mypy: type checking estricto en domain/application
  # ───────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^src/yvy/(domain|application)/
        additional_dependencies:
          - pydantic>=2.9.0
          - types-requests
          - types-Pillow

  # ───────────────────────────────────────────────────────────────────────────
  # Pytest local (solo tests rápidos en pre-commit)
  # ───────────────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest unit tests
        entry: poetry run pytest -m "unit and not slow" --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
